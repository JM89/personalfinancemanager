name: Build and Tests PFM Website Reboot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DOTNET_ENV: '11.0.x'
  WORKDIR: PFM.Website.Reboot/
  GITHUB_ORG: 'JM89'

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PFM.Website.Reboot/src/PFM.Website.Client
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PFM.Website.Reboot/src/PFM.Website.Client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core SDK ${{ env.DOTNET_ENV }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_ENV }}     
      - name: Log in to access GitHub Packages 
        env:
          PACKAGE_TOKEN: ${{ secrets.PAT_READ_PACKAGES }}
        run: |
          if [ -z "$PACKAGE_TOKEN" ]; then
            echo "::error::PAT_READ_PACKAGES is missing or unavailable to this workflow. Add an Actions secret containing a classic PAT with read:packages."
            exit 1
          fi
          dotnet nuget add source --username "$GITHUB_ORG" --password "$PACKAGE_TOKEN" "https://nuget.pkg.github.com/$GITHUB_ORG/index.json" --name "$GITHUB_ORG - GitHub Packages" --store-password-in-clear-text
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PFM.Website.Reboot/src/PFM.Website.Client/package-lock.json
      - name: Build React for publishing
        working-directory: PFM.Website.Reboot/src/PFM.Website.Client
        run: npm ci && npm run build
      - name: Publish and smoke-test the website
        run: |
          publish_dir="$RUNNER_TEMP/pfm-website"
          dotnet publish src/PFM.Website/PFM.Website.csproj --configuration Release --no-build --output "$publish_dir"
          (
            cd "$publish_dir"
            exec env ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5110 \
              APP_AuthOptions__DevOffline=true dotnet PFM.Website.dll
          ) &
          host_pid=$!
          (
            cd "$publish_dir"
            exec env ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5111 \
              APP_ApplicationSettings__ExternalServiceSettings__PfmApiOptions__Enabled=true dotnet PFM.Website.dll
          ) &
          live_pid=$!
          trap 'kill "$host_pid" "$live_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5110/health/frontend
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5111/health/frontend
          PFM_OFFLINE_URL=http://127.0.0.1:5110 PFM_LIVE_URL=http://127.0.0.1:5111 npm --prefix src/PFM.Website.Client test