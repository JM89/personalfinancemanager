version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/PFM.Website.Reboot/src/PFM.Website.Client"
      - "/docs/sites"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      docusaurus:
        patterns:
          - "@docusaurus/*"
  - package-ecosystem: "nuget" 
    directories: 
      - "/*/" 
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EventStore.Client.Grpc.Streams"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker" 
    directories:
      - "/*/" 
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions" 
    directory: "/" 
    schedule:
      interval: "weekly"
